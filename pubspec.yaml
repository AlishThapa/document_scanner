name: document_scanner
description: "A premium Flutter OCR application with glassmorphism UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # OCR
  google_mlkit_text_recognition: ^0.15.1
  # tesseract_ocr is removed due to broken dependency SwiftyTesseract401 on iOS

  # Camera / image picking
  image_picker: ^1.2.2
  photo_manager: ^3.9.0
  camera: ^0.11.0

  # Image processing
  image: ^4.2.0

  # Storage & persistence
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # UI utilities
  flutter_animate: ^4.5.0
  blur: ^3.1.0
  share_plus: ^10.0.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  go_router: ^14.2.0

  # Utils
  uuid: ^4.4.2
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  photo_manager_image_provider: ^2.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
